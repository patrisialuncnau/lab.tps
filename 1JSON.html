<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    table {
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid black;
      padding: 8px;
    }
  </style>
</head>
<body>
  <table id="tabella">
    <tr>
      <th>Nome</th>
      <th>Cognome</th>
      <th>Età</th>
      <th>Sport</th>
    </tr>
    <tr>
      <td><input type="text" id="nome"></td>
      <td><input type="text" id="cognome"></td>
      <td><input type="number" id="eta"></td>
      <td>
        <select id="sport">
          <option>Pallavolo</option>
          <option>Calcio</option>
          <option>Basket</option>
          <option>Nuoto</option>
          <option>Buono a nulla</option>
          <option>Disoccupato</option>
        </select>
      </td>
    </tr>
  </table>
  <script>
    var stringaJson = `{
      "nome": "Patrisia",
      "cognome": "Luncanu",
      "eta": 18,
      "sport": "Pallavolo"
    }`; 
    var dati = JSON.parse(stringaJson);
    document.getElementById("nome").value = dati.nome;
    document.getElementById("cognome").value = dati.cognome;
    document.getElementById("eta").value = dati.eta;
    document.getElementById("sport").value = dati.sport;
  </script>
</body>
</html>
