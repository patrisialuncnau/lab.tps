<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    table {
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid black;
      padding: 8px;
    }
  </style>
</head>
<body>
  <table id="tabella">
    <tr>
      <th>Nome</th>
      <th>Cognome</th>
      <th>Età</th>
      <th>Sport</th>
    </tr>
    <tr>
      <td><input type="text" id="nome"></td>
      <td><input type="text" id="cognome"></td>
      <td><input type="number" id="eta"></td>
      <td>
        <select id="sport">
          <option>Pallavolo</option>
          <option>Calcio</option>
          <option>Basket</option>
          <option>Nuoto</option>
          <option>Disoccupato</option>
        </select>
      </td>
    </tr>
  </table>
  <script>
    let xmlhttp = new XMLHttpRequest();
    xmlhttp.open("GET", "dati.json", true);
    xmlhttp.onload = function() {
      let dati = JSON.parse(xmlhttp.responseText);
    };
    xmlhttp.send();
  </script>
</body>
</html>
