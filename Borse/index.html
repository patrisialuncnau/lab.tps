<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boutique Luxury Bags</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f6f1e7;
}

header{
    background:#111;
    color:#d4af37;
    text-align:center;
    padding:25px;
    font-size:22px;
    letter-spacing:3px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:25px;
    padding:40px;
}

.card{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.card img{
    width:100%;
    height:260px;
    object-fit:cover;
}

.content{
    padding:15px;
}

.brand{
    color:#b08d57;
    font-weight:bold;
    letter-spacing:1px;
}

.model{
    font-size:16px;
    margin:5px 0;
}

.price{
    font-size:18px;
    font-weight:bold;
    color:#111;
}

button{
    width:100%;
    padding:12px;
    background:#b08d57;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
    margin-top:10px;
}

button:hover{
    background:#8c6f3e;
}
</style>
</head>
<body>

<header id="title">LUXURY BOUTIQUE</header>

<div class="grid" id="grid"></div>

<script>
const config = JSON.parse(localStorage.getItem("config")) || {csv:"borse.csv",shop:"Luxury Boutique"};

document.getElementById("title").innerText = config.shop;

fetch(config.csv)
.then(r=>r.text())
.then(data=>{

let rows = data.split("\n").slice(1);
let html="";

rows.forEach((r,i)=>{
let c=r.split(",");

html+=`
<div class="card">
<img src="${c[3]}">
<div class="content">
<div class="brand">${c[0]}</div>
<div class="model">${c[1]}</div>
<div class="price">€ ${c[4]}</div>
<button onclick="openP(${i})">Dettagli</button>
</div>
</div>`;
});

document.getElementById("grid").innerHTML=html;
localStorage.setItem("csvData",data);
});

function openP(i){
localStorage.setItem("selected",i);
location.href="product.html";
}
</script>

</body>
</html>
