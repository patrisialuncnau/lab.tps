<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dettaglio Prodotto</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f6f1e7;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:40px;
}

.product{
    display:flex;
    gap:30px;
    background:white;
    padding:25px;
    border-radius:18px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

.product img{
    width:420px;
    border-radius:15px;
    object-fit:cover;
}

h1{
    color:#b08d57;
}

.price{
    font-size:24px;
    font-weight:bold;
}

button{
    padding:12px 18px;
    background:#b08d57;
    border:none;
    color:white;
    border-radius:10px;
    cursor:pointer;
    margin-top:10px;
}

button:hover{
    background:#8c6f3e;
}

.cart{
    margin-top:30px;
    background:white;
    padding:20px;
    border-radius:15px;
}

</style>
</head>
<body>

<div class="container">

<div class="product" id="p"></div>

<div class="cart">
<h2>Carrello Luxury</h2>
<ul id="cart"></ul>
<h3 id="total"></h3>
<button onclick="window.print()">Stampa PDF</button>
</div>

</div>

<script>

let data=localStorage.getItem("csvData").split("\n").slice(1);
let i=localStorage.getItem("selected");

let c=data[i].split(",");

document.getElementById("p").innerHTML=`
<img src="${c[3]}">
<div>
<h1>${c[0]} ${c[1]}</h1>
<p>${c[2]}</p>
<div class="price">€ ${c[4]}</div>
<button onclick="add()">Aggiungi al carrello</button>
</div>
`;

let cart=JSON.parse(localStorage.getItem("cart"))||[];

function add(){
cart.push({name:c[0]+" "+c[1],price:+c[4]});
localStorage.setItem("cart",JSON.stringify(cart));
render();
}

function render(){
let t=0;
document.getElementById("cart").innerHTML=cart.map(x=>{
t+=x.price;
return `<li>${x.name} - €${x.price}</li>`;
}).join("");
document.getElementById("total").innerText="Totale € "+t;
}

render();

</script>

</body>
</html>
