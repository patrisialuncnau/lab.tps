<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configurazione CSV</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:40px;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    color:#d63384;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:14px;
    border:none;
    background:#d63384;
    color:white;
    font-size:16px;
    border-radius:10px;
    cursor:pointer;
}

button:hover{
    background:#b0256d;
}

.info{
    margin-top:20px;
    background:#ffe6f2;
    padding:15px;
    border-radius:10px;
}
</style>
</head>
<body>

<div class="container">

<h1>Configurazione Piattaforma</h1>

<label>Nome file CSV</label>
<input type="text" id="csvFile" value="borse.csv">

<label>Nome negozio</label>
<input type="text" id="shopName" value="Luxury Bags">

<button onclick="saveConfig()">Salva Configurazione</button>

<div class="info">
<p><strong>Campi richiesti nel CSV:</strong></p>
<ul>
<li>marca</li>
<li>modello</li>
<li>descrizione</li>
<li>immagine</li>
<li>prezzo</li>
</ul>
</div>

</div>

<script>
function saveConfig(){

    const config = {
        csv: document.getElementById("csvFile").value,
        shop: document.getElementById("shopName").value
    };

    localStorage.setItem("config", JSON.stringify(config));

    alert("Configurazione salvata!");
}
</script>

</body>
</html>
