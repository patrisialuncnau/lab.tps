<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Config Boutique</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f6f1e7;
}

.box{
    max-width:600px;
    margin:80px auto;
    background:white;
    padding:40px;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
    border:1px solid #d4af37;
}

h1{
    text-align:center;
    color:#b08d57;
    letter-spacing:2px;
}

input{
    width:100%;
    padding:14px;
    margin:10px 0;
    border:1px solid #d4af37;
    border-radius:10px;
}

button{
    width:100%;
    padding:14px;
    background:#b08d57;
    color:white;
    border:none;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#8c6f3e;
}
</style>
</head>
<body>

<div class="box">
<h1>LUXURY BAGS CONFIG</h1>

<input id="csv" value="borse.csv">
<input id="shop" value="Luxury Boutique">

<button onclick="save()">Salva Configurazione</button>
</div>

<script>
function save(){
    localStorage.setItem("config", JSON.stringify({
        csv:document.getElementById("csv").value,
        shop:document.getElementById("shop").value
    }));
    alert("Configurazione salvata");
}
</script>

</body>
</html>
