<!DOCTYPE html>
<html>
<head>
<title>Carrello</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
<div>LUXURY BAGS</div>
<a href="index.html">Home</a>
</nav>

<div style="padding:50px;font-style:italic">

<h1>Il tuo carrello</h1>

<div id="cart"></div>

<h2 id="total"></h2>

<p style="color:#2e7d32">
Spedizione gratuita sopra 200€
</p>

<button onclick="checkout()">Procedi al checkout</button>

</div>

<script>
let cart=JSON.parse(localStorage.getItem("cart")||"[]");

let total=0;

document.getElementById("cart").innerHTML=cart.map(p=>{
total+=p.price;
return `
<div style="background:white;padding:15px;margin:10px 0;border-radius:10px;box-shadow:0 5px 15px rgba(0,0,0,0.1)">
${p.name} - €${p.price}
</div>
`;
}).join("");

document.getElementById("total").innerText="Totale: € "+total;

function checkout(){
alert("Pagamento luxury simulato completato");
}
</script>

</body>
</html>
